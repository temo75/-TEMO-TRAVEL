<!doctype html>
<html lang="ka"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071b35"><title>TEMO TRAVEL | სასტუმროები კრეტაზე</title>
<style>
:root{--navy:#071b35;--cyan:#65d8e8;--ink:#142b43;--muted:#64788c}*{box-sizing:border-box}body{margin:0;background:#f4f8fb;color:var(--ink);font-family:Arial,sans-serif}header{background:var(--navy);color:white;padding:22px 5%}a{color:inherit;text-decoration:none}.brand{font-weight:900;font-size:21px}.brand b{color:var(--cyan)}main{width:min(1100px,90%);margin:38px auto}h1{color:var(--navy)}.intro{color:var(--muted);line-height:1.6}.tools{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}.tools input,.tools select{padding:13px;border:1px solid #d5e0e9;border-radius:9px;font-size:15px;background:white}.tools input{flex:1;min-width:210px}.count{color:var(--muted);font-size:14px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.hotel{background:white;border:1px solid #dce6ee;border-radius:13px;padding:19px;box-shadow:0 5px 18px #193b590b}.hotel h2{font-size:19px;margin:0 0 9px}.meta{color:var(--muted);font-size:14px;line-height:1.6}.hotel a{color:#087fa8;font-weight:700}.empty{background:white;border-radius:12px;padding:25px;color:var(--muted)}footer{padding:25px 5%;color:#9fb3c9;background:#06162b;font-size:13px}small{color:#64788c}
</style></head><body><header><a class="brand" href="index.html">TEMO <b>TRAVEL</b></a></header>
<main><h1>სასტუმროები კრეტაზე</h1><p class="intro">OpenStreetMap-ის ღია მონაცემებიდან ავტომატურად განახლებული სასტუმროებისა და საცხოვრებლების სია.</p>
<div class="tools"><input id="q" type="search" placeholder="მოძებნე სახელი ან ქალაქი"><select id="kind"><option value="">ყველა ტიპი</option><option value="hotel">სასტუმრო</option><option value="guest_house">საოჯახო სასტუმრო</option><option value="hostel">ჰოსტელი</option><option value="apartment">აპარტამენტი</option><option value="resort">კურორტი</option><option value="motel">მოტელი</option></select></div>
<div class="count" id="count">მონაცემები იტვირთება…</div><section class="grid" id="list"></section><p><small>© OpenStreetMap contributors · მონაცემთა ლიცენზია: ODbL · <span id="updated"></span></small></p></main>
<footer>© <span id="year"></span> TEMO TRAVEL</footer>
<script>
(async()=>{const list=document.getElementById('list'),q=document.getElementById('q'),kind=document.getElementById('kind'),count=document.getElementById('count');let hotels=[];
const labels={hotel:'სასტუმრო',guest_house:'საოჯახო სასტუმრო',hostel:'ჰოსტელი',apartment:'აპარტამენტი',resort:'კურორტი',motel:'მოტელი',chalet:'შალე'};
function render(){const term=q.value.trim().toLocaleLowerCase();const rows=hotels.filter(h=>(!kind.value||h.type===kind.value)&&(!term||[h.name,h.city,h.address].join(' ').toLocaleLowerCase().includes(term)));count.textContent='ნაპოვნია: '+rows.length+' / '+hotels.length;
list.replaceChildren();if(!rows.length){const p=document.createElement('p');p.className='empty';p.textContent='შედეგი ვერ მოიძებნა.';list.append(p);return;}
for(const h of rows){const card=document.createElement('article');card.className='hotel';const title=document.createElement('h2');title.textContent=h.name||'უსახელო ობიექტი';const meta=document.createElement('p');meta.className='meta';meta.textContent=[labels[h.type]||h.type,h.city,h.address,h.stars?(h.stars+' ★'):null,h.phone].filter(Boolean).join(' · ');card.append(title,meta);if(h.website){const a=document.createElement('a');a.href=h.website;a.target='_blank';a.rel='noopener noreferrer';a.textContent='ვებგვერდი';card.append(a);}list.append(card);}}
q.addEventListener('input',render);kind.addEventListener('change',render);
try{const r=await fetch('data/hotels-crete.json',{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const data=await r.json();hotels=data.hotels||[];document.getElementById('updated').textContent='ბოლო განახლება: '+(data.updated||'უცნობია');render();}catch(e){count.textContent='სასტუმროების სია ჯერ არ ჩატვირთულა. მონაცემთა განახლება GitHub Actions-იდან გაუშვი.';list.innerHTML='<p class="empty">მონაცემები დროებით მიუწვდომელია.</p>';console.error(e);}
document.getElementById('year').textContent=new Date().getFullYear();})();
</script></body></html>
