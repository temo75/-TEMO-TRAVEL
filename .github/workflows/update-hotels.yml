name: Update Crete hotel data
on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Import OpenStreetMap accommodation data
        run: node scripts/update-hotels.mjs
      - name: Commit updated dataset
        run: |
          if git diff --quiet -- data/hotels-crete.json; then
            echo "No hotel data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/hotels-crete.json
          git commit -m "Update Crete accommodation dataset"
          git push